name: Quality Gate & Tests

# The release pipeline (build_apk.yml) only runs on main and only builds. This workflow is the
# cheap, always-on half: the mechanical AGENTS.md rules, the JVM unit tests, and a compile so a
# PR can never land something that does not even build.

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: AGENTS.md rules (grep gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No JDK, no SDK: this is the feedback loop that should answer in seconds.
      - name: Run quality gate
        run: |
          set -e
          fail=0
          echo "Package must be com.bansify.browser everywhere."
          if grep -rn "com\.example" app/src app/build.gradle.kts 2>/dev/null; then
            echo "::error::Found com.example in the tree"
            fail=1
          fi
          grep -q 'namespace = "com.bansify.browser"' app/build.gradle.kts \
            || { echo "::error::namespace must be com.bansify.browser"; fail=1; }
          grep -q 'applicationId = "com.bansify.browser"' app/build.gradle.kts \
            || { echo "::error::applicationId must be com.bansify.browser"; fail=1; }
          for f in gradlew app/build.gradle.kts settings.gradle.kts \
                   app/src/main/AndroidManifest.xml app/src/main/res/values/strings.xml; do
            [ -f "$f" ] || { echo "::error::missing required file $f"; fail=1; }
          done
          echo "Quality gate finished with status $fail"
          exit $fail

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Robolectric downloads its android-all runtime from Maven Central on first use. That
      # fetch is the one flaky part of this job, so the jars are cached across runs.
      - name: Cache Robolectric runtime
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/src/test/resources/robolectric.properties') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Unit tests
        run: |
          set -o pipefail
          # Robolectric downloads its android-all runtime from Maven Central on first use;
          # that fetch fails now and then and takes the whole job with it. One retry, then
          # let the real failure through.
          ./gradlew :app:testDebugUnitTest --no-daemon --continue --stacktrace 2>&1 | tee gradle.log || {
            echo "::warning::first attempt failed, retrying once (Robolectric artifact fetch)"
            ./gradlew :app:testDebugUnitTest --no-daemon --continue --stacktrace 2>&1 | tee -a gradle.log
          }

      # The raw log lives behind an endpoint a sandboxed runner often cannot reach, and a red X
      # with no message teaches nobody anything: put the useful lines in the job summary.
      - name: Publish the failure in the job summary
        if: failure()
        run: |
          {
            echo "### Gradle failure (last 80 lines)"
            echo '```'
            tail -n 80 gradle.log 2>/dev/null || echo "no gradle.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Compile (debug) + Android lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Debug builds use the default ~/.android/debug.keystore that AGP creates on first use,
      # so no keystore step is needed here.
      - name: Compile debug
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --continue --stacktrace 2>&1 | tee gradle.log

      - name: Publish the failure in the job summary
        if: failure()
        run: |
          {
            echo "### Gradle failure (last 80 lines)"
            echo '```'
            tail -n 80 gradle.log 2>/dev/null || echo "no gradle.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Android lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
